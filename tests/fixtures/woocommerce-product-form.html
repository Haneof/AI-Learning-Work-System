<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>New Product ‹ Store — WordPress</title>
  </head>
  <body>
    <main id="wpbody-content">
      <div id="message" class="notice notice-success is-dismissible">
        <p>Product draft updated.</p>
      </div>
      <form id="post">
        <label for="title">Product name</label>
        <input id="title" name="post_title" type="text" value="Fixture Product">
        <label for="content">Product description</label>
        <textarea id="content" name="content">A fixture product description.</textarea>
        <label for="excerpt">Short description</label>
        <textarea id="excerpt" name="excerpt">A short fixture description.</textarea>
        <label for="product-type">Product type</label>
        <select id="product-type" name="product-type">
          <option value="simple" selected>Simple product</option>
          <option value="variable">Variable product</option>
        </select>
        <label for="_regular_price">Regular price</label>
        <input id="_regular_price" name="_regular_price" type="text" value="19.95">
        <button id="publish" type="button">Publish</button>
      </form>
    </main>
  </body>
</html>
