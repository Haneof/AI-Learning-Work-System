[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-work-system"
version = "0.1.0"
description = "A modular foundation for an AI learning and work system"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]
media = ["pypdf>=5,<7"]
acquisition = [
  "yt-dlp>=2024.10.22",
  "google-api-python-client>=2.150,<4",
  "google-auth-oauthlib>=1.2,<2",
]
gui = ["playwright>=1.52,<2"]

[project.scripts]
aios = "aios_work_system.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
