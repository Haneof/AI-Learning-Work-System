name: Temporary Ruff Format Repair

on:
  push:
    branches:
      - feature/video-acquisition-pipeline
    paths:
      - ".github/workflows/_temporary-ruff-format-repair.yml"

permissions:
  contents: read

jobs:
  format-and-show-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.11,<1"
      - name: Run Ruff formatter on the five requested files
        run: |
          ruff format \
            src/aios_work_system/acquisition/drive.py \
            src/aios_work_system/acquisition/pipeline.py \
            src/aios_work_system/acquisition/platforms.py \
            src/aios_work_system/acquisition/records.py \
            tests/test_acquisition.py
      - name: Print formatter diff for exact patch review
        run: git diff -- src/aios_work_system/acquisition/drive.py src/aios_work_system/acquisition/pipeline.py src/aios_work_system/acquisition/platforms.py src/aios_work_system/acquisition/records.py tests/test_acquisition.py
