name: Temporary PR 37 Ruff formatting

on:
  push:
    branches:
      - feature/workflow-decision-contract-v0.1
    paths:
      - .github/workflows/format-pr37.yml
      - contracts/validate.py
      - tests/test_contracts.py

permissions:
  contents: write

concurrency:
  group: pr37-ruff-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/workflow-decision-contract-v0.1
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Format and verify the two requested files
        run: |
          ruff --version
          ruff format contracts/validate.py tests/test_contracts.py
          ruff format --check contracts/validate.py tests/test_contracts.py
      - name: Commit and push formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- contracts/validate.py tests/test_contracts.py
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
          else
            git commit -m "style: format workflow decision contract files"
            git push origin HEAD:refs/heads/feature/workflow-decision-contract-v0.1
          fi
