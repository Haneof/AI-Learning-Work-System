name: Python CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,gui]"
      - name: Install local browser engine
        run: playwright install --with-deps chromium
      - name: Lint
        run: ruff check .
      - name: Format check for GUI milestone files
        run: ruff format --check src/aios_work_system/gui tests/test_gui.py
      - name: Test
        run: pytest
