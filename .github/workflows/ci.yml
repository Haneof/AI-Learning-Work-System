name: Python CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check for knowledge package changes
        run: >
          ruff format --check
          src/aios_work_system/skills/compiler.py
          src/aios_work_system/skills/validator.py
          src/aios_work_system/phase0.py
          tests/test_skill_compiler.py
          tests/test_skills.py
          tests/test_pvd_skill_acceptance.py
      - name: Test
        run: pytest
