name: Temporary Ruff repair for video extraction PR

on:
  push:
    branches:
      - feature/video-file-extraction-pipeline
    paths:
      - .github/workflows/format-video-pr.yml
      - scripts/download_tutorial_video.py
      - scripts/run_video_file_pipeline.py
      - src/aios_work_system/video_extraction/**
      - tests/test_video_file_extraction.py

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/video-file-extraction-pipeline
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: python -m pip install -e ".[dev]"
      - name: Automatically fix import ordering and format Python files
        run: |
          ruff check --fix .
          ruff format .
          ruff check .
          ruff format --check .
      - name: Commit and push formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/download_tutorial_video.py scripts/run_video_file_pipeline.py src/aios_work_system/video_extraction tests/test_video_file_extraction.py
          if git diff --cached --quiet; then
            echo "No Ruff changes were required."
          else
            git commit -m "style: apply Ruff to video extraction pipeline"
            git push origin HEAD:refs/heads/feature/video-file-extraction-pipeline
          fi
