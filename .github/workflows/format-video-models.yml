name: Temporary Ruff repair for local video models

on:
  push:
    branches:
      - feature/video-file-extraction-pipeline
    paths:
      - .github/workflows/format-video-models.yml
      - scripts/download_video_models.py
      - scripts/run_video_file_pipeline.py
      - src/aios_work_system/video_extraction/**
      - tests/test_local_video_models.py
      - tests/test_video_file_extraction.py

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/video-file-extraction-pipeline
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: python -m pip install ruff==0.17.6
      - name: Apply safe import fixes and formatting
        run: |
          ruff check --fix . || true
          ruff format .
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/download_video_models.py scripts/run_video_file_pipeline.py src/aios_work_system/video_extraction tests/test_local_video_models.py tests/test_video_file_extraction.py
          if git diff --cached --quiet; then
            echo "No autoformat changes were required."
          else
            git commit -m "style: apply Ruff import fixes and formatting"
            git push origin HEAD:refs/heads/feature/video-file-extraction-pipeline
          fi
