name: Real Media Sample Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/aios_work_system/media/**"
      - "scripts/validate_real_media_sample.py"
      - ".github/workflows/real-media-sample.yml"

permissions:
  contents: read

jobs:
  real-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and package
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Download openly licensed real tutorial sample
        run: |
          mkdir -p artifacts/real-media
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://upload.wikimedia.org/wikipedia/commons/1/18/LibreOffice_Writer_%E2%80%93_The_Basics.webm" \
            --output artifacts/real-media/LibreOffice_Writer_Basics.webm
          test -s artifacts/real-media/LibreOffice_Writer_Basics.webm
      - name: Run actual FFmpeg integration
        run: |
          python scripts/validate_real_media_sample.py \
            --input artifacts/real-media/LibreOffice_Writer_Basics.webm \
            --output-dir artifacts/real-media/output
      - name: Upload real-media test report and derived artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: real-media-sample-report
          path: artifacts/real-media/
          if-no-files-found: warn
          retention-days: 14
