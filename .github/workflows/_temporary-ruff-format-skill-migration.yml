name: Temporary Ruff Format Skill Migration

on:
  push:
    branches:
      - feature/skill-compilation-core
    paths:
      - ".github/workflows/_temporary-ruff-format-skill-migration.yml"

permissions:
  contents: read

jobs:
  format-and-show-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.11,<1"
      - name: Run Ruff formatter on the migrated Python files
        run: |
          ruff format \
            src/aios_work_system/skills/compiler.py \
            src/aios_work_system/skills/repository.py \
            src/aios_work_system/skills/__init__.py \
            src/aios_work_system/knowledge/repository.py \
            src/aios_work_system/knowledge/types.py \
            src/aios_work_system/knowledge/__init__.py \
            tests/test_skill_compiler.py \
            tests/test_skill_repository.py \
            tests/test_knowledge_repository.py
      - name: Print formatter diff for exact patch review
        run: git diff -- src/aios_work_system/skills/compiler.py src/aios_work_system/skills/repository.py src/aios_work_system/skills/__init__.py src/aios_work_system/knowledge/repository.py src/aios_work_system/knowledge/types.py src/aios_work_system/knowledge/__init__.py tests/test_skill_compiler.py tests/test_skill_repository.py tests/test_knowledge_repository.py
